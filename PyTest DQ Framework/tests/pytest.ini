[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra
markers =
	example: illustrative framework tests, not production DQ checks
	parquet_data: production checks against Parquet datasets
	smoke: basic dataset availability check
	facility_name_min_time_spent_per_visit_date: checks for this Parquet dataset
	facility_type_avg_time_spent_per_visit_date: checks for this Parquet dataset
	patient_sum_treatment_cost_per_facility_type: checks for this Parquet dataset
